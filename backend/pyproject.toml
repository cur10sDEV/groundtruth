[project]
name = "rag-prod-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "qdrant-client>=1.12",
    "boto3>=1.35",
    "redis>=5.2",
    "redisvl>=0.3",
    "aio-pika>=9.4",
    "litellm>=1.53",
    "fastembed>=0.4",
    "openai>=1.54",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9",
    "passlib>=1.7",
    "bcrypt>=4.0,<5",
    "alembic>=1.14",
    "flagsmith>=3.8",
    "langfuse>=2.54",
    "opentelemetry-api>=1.28",
    "prometheus-client>=0.21",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: requires live infrastructure (run with: -m integration)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.params.File",
]
