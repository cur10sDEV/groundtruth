name: rag-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # bucket-event trigger -> RabbitMQ (this MinIO release accepts notify
      # targets via env vars only; `mc admin config set` is a silent no-op)
      MINIO_NOTIFY_AMQP_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_AMQP_URL_PRIMARY: "amqp://${RABBIT_USER:-guest}:${RABBIT_PASS:-guest}@rabbitmq:5672"
      MINIO_NOTIFY_AMQP_EXCHANGE_PRIMARY: "minio.events"
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_PRIMARY: "direct"
      MINIO_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: "minio.events"
      MINIO_NOTIFY_AMQP_DURABLE_PRIMARY: "on"
      MINIO_NOTIFY_AMQP_QUEUE_DIR_PRIMARY: "/tmp/minio-events"
      MINIO_NOTIFY_AMQP_QUEUE_LIMIT_PRIMARY: "10000"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - "miniodata:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBIT_USER: guest
      RABBIT_PASS: guest
    volumes:
      - "./minio-init:/init"
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rag-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmqdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: rag-flagsmith
    environment:
      DATABASE_URL: postgres://rag:rag@postgres:5432/flagsmith
      EDGE_DATABASE_URL: postgres://rag:rag@postgres:5432/flag_engine
      FLAGSMITH_DATABASE_NAME: flagsmith
      FLAGSMITH_DATABASE_PASSWORD: rag
      FLAGSMITH_DATABASE_USER: rag
      DJANGO_ALLOWED_HOSTS: "*"
      ENABLE_EDGE: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["flagsmithdata:/var/lib/flagsmith"]

  edge:
    image: flagsmith/edge-proxy:latest
    container_name: rag-flagsmith-edge
    environment:
      DATABASE_URL: postgres://rag:rag@postgres:5432/flag_engine
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    depends_on:
      - postgres

  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning"
      - "grafanadata:/var/lib/grafana"
      - "./grafana/dashboards:/var/lib/grafana/dashboards"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  qdrantdata:
  rabbitmqdata:
  flagsmithdata:
  grafanadata:
